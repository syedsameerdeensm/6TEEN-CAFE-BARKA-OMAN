<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6TEEN Cafe - Barka, Oman ☕</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:#fff7f0;
            text-align:center;
            overflow:hidden;
        }

        .container{
            padding-top:80px;
        }

        h1{
            color:#d35400;
            font-size:70px;
            margin-bottom:10px;
        }

        h2{
            font-size:48px;
            margin-bottom:10px;
        }

        h3{
            color:#555;
            font-size:32px;
            margin-bottom:20px;
        }

        .buttons{
            display:flex;
            justify-content:center;
            gap:20px;
            margin-top:25px;
        }

        button{
            padding:18px 35px;
            font-size:26px;
            border:none;
            border-radius:12px;
            cursor:pointer;
        }

        #yes{
            background:#27ae60;
            color:white;
        }

        #no{
            background:#e74c3c;
            color:white;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>☕ 6TEEN Cafe ☕</h1>

    <h3>📍 Barka, Oman 🇴🇲</h3>

    <h2>Do You Love Our Cafe? ❤️</h2>

    <h3>We'd Love To Know What You Think 😊</h3>

    <div class="buttons">
        <button id="yes" onclick="showThanks()">
            ❤️ Yes, I Love It!
        </button>

        <button id="no">
            😅 Maybe Later
        </button>
    </div>

</div>

<script>

const noBtn = document.getElementById("no");
let moved = false;

noBtn.addEventListener("mouseover", () => {

    if(!moved){
        noBtn.style.position = "absolute";
        moved = true;
    }

    noBtn.style.left =
        Math.random() * (window.innerWidth - 180) + "px";

    noBtn.style.top =
        Math.random() * (window.innerHeight - 80) + "px";
});

function showThanks() {

    document.body.innerHTML = `
        <div style="
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            text-align:center;
            min-height:100vh;
            background:#fff7f0;
            padding:20px;
        ">

            <h1 style="
                font-size:70px;
                color:#d35400;
                margin-bottom:20px;
            ">
                🎉 THANK YOU! 🎉
            </h1>

            <h2 style="
                font-size:45px;
                margin-bottom:25px;
            ">
                We're Happy You Love 6TEEN Cafe ❤️
            </h2>

            <img src="6teencafe.jpeg"
                 style="
                    width:500px;
                    max-width:90%;
                    border-radius:20px;
                    margin:20px 0;
                 ">

            <p style="
                font-size:34px;
                font-weight:bold;
                margin-top:25px;
            ">
                ☕ Your Support Means A Lot To Us!
            </p>

            <p style="
                font-size:30px;
                margin-top:15px;
            ">
                😊 We Look Forward To Serving You Again Soon
            </p>

            <h3 style="
                font-size:32px;
                margin-top:20px;
            ">
                📍 Barka, Oman 🇴🇲
            </h3>

        </div>
    `;
}

</script>

</body>
</html>
