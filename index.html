<!DOCTYPE html>

<html>
<head>
    <title>6TEEN Cafe - Barka, Oman ☕</title>

```
<style>
    body{
        text-align:center;
        font-family:Arial, sans-serif;
        background:#fff7f0;
        margin-top:120px;
        overflow:hidden;
    }

    h1{
        color:#d35400;
    }

    h3{
        color:#555;
    }

    .buttons{
        display:flex;
        justify-content:center;
        gap:15px;
        margin-top:25px;
    }

    button{
        padding:12px 25px;
        font-size:18px;
        cursor:pointer;
        border:none;
        border-radius:10px;
    }

    #yes{
        background:#27ae60;
        color:white;
    }

    #no{
        background:#e74c3c;
        color:white;
    }

    img{
        width:350px;
        max-width:90%;
        margin-top:20px;
        border-radius:15px;

```

</head>

<body>

```
<h1>☕ 6TEEN Cafe ☕</h1>
<h3>Barka, Oman 🇴🇲</h3>

<h2>Do You Love Our Cafe? ❤️</h2>
<h3>We'd love to know what you think 😊</h3>

<div class="buttons">
    <button id="yes" onclick="showThanks()">❤️ Yes, I Love It!</button>
    <button id="no">😅 Maybe Later</button>
</div>

<script>
    const noBtn = document.getElementById("no");
    let moved = false;

    noBtn.addEventListener("mouseover", () => {

        if(!moved){
            noBtn.style.position = "absolute";
            moved = true;
        }

        noBtn.style.left =
            Math.random() * (window.innerWidth - 150) + "px";

        noBtn.style.top =
            Math.random() * (window.innerHeight - 80) + "px";
    });

    function showThanks() {
        document.body.innerHTML = `
            <h1>🎉 Thank You! 🎉</h1>

            <h2>We're happy you love 6TEEN Cafe ❤️</h2>

            <img src="6teencafe.jpeg" alt="6TEEN Cafe Greeting">

            <p>☕ Your support means a lot to us!</p>

            <p>We look forward to serving you again soon 😊</p>

            <h3>📍 Barka, Oman 🇴🇲</h3>
        `;
    }
</script>
```

</body>
</html>
