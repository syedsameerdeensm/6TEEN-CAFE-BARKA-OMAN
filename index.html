<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        font-family:Arial, sans-serif;
        background:#fff7f0;
        min-height:100vh;
        display:flex;
        justify-content:center;

        text-align:center;
        overflow:hidden;
    }

    .container{
        padding:20px;
    }

    h1{
        color:#d35400;
        font-size:50px;
        margin-bottom:10px;

    h3{
        color:#555;
        font-size:24px;
        margin-bottom:20px;

    .buttons{
        display:flex;
        justify-content:center;

        margin-top:25px;

        border-radius:20px;
        margin:25px 0;

</head>

<body>

<div class="container">
    <h1>☕ 6TEEN Cafe ☕</h1>

```
<h3>📍 Barka, Oman 🇴🇲</h3>

<h2>Do You Love Our Cafe? ❤️</h2>

<h3>We'd Love To Know What You Think 😊</h3>

<div class="buttons">
    <button id="yes" onclick="showThanks()">
        ❤️ Yes, I Love It!
    </button>

    <button id="no">
        😅 Maybe Later
    </button>
</div>
```

</div>

<script>
const noBtn = document.getElementById("no");
let moved = false;

noBtn.addEventListener("mouseover", () => {

    if(!moved){
        noBtn.style.position = "absolute";
        moved = true;
    }

    noBtn.style.left =
        Math.random() * (window.innerWidth - 180) + "px";

    noBtn.style.top =
        Math.random() * (window.innerHeight - 80) + "px";
});

function showThanks() {

    document.body.innerHTML = `
        <div class="thankyou">

            <h1>🎉 THANK YOU! 🎉</h1>

            <h2>We're Happy You Love 6TEEN Cafe ❤️</h2>

            <img src="6teencafe.jpeg"
                 alt="6TEEN Cafe Greeting">

            <p>☕ Your Support Means A Lot To Us!</p>

            <p>😊 We Look Forward To Serving You Again Soon</p>

            <h3>📍 Barka, Oman 🇴🇲</h3>

        </div>
    `;
}
</script>

</body>
