<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6TEEN Cafe ☕</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#fff7f0;
    text-align:center;
    overflow:hidden;
}

.container{
    padding-top:40px;
}

h1{
    color:#d35400;
    font-size:28px;
    margin-bottom:8px;
}

h2{
    font-size:20px;
    margin-bottom:8px;
}

h3{
    color:#555;
    font-size:16px;
    margin-bottom:15px;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:15px;
    flex-wrap:wrap;
}

button{
    padding:10px 16px;
    font-size:16px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

#yes{
    background:#27ae60;
    color:white;
}

#no{
    background:#e67e22;
    color:white;
    position:relative;
}

.thank-page{
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    align-items:center;
    text-align:center;
    min-height:100vh;
    padding:15px;
}

.thank-page h1{
    font-size:26px;
    color:#d35400;
    margin-top:10px;
}

.thank-page h2{
    font-size:18px;
    margin:10px 0;
}

.thank-page img{
    width:80%;
    max-width:220px;
    border-radius:12px;
    margin:10px 0;
}

.thank-page p{
    font-size:14px;
    margin-top:8px;
}

.thank-page h3{
    font-size:16px;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="container">
    <h1>☕ 6TEEN Cafe ☕</h1>
    <h3>📍 Barka, Oman 🇴🇲</h3>

    <h2>Do You Love Our Cafe? ❤️</h2>
    <h3>We'd Love Your Feedback 😊</h3>

    <div class="buttons">
        <button id="yes" onclick="showThanks()">❤️ Yes</button>
        <button id="no">🤔 I’m Not Sure Yet</button>
    </div>
</div>

<script>

const noBtn = document.getElementById("no");
let moved = false;

noBtn.addEventListener("mouseover", () => {

    if(!moved){
        noBtn.style.position = "absolute";
        moved = true;
    }

    noBtn.style.left =
        Math.random() * (window.innerWidth - 80) + "px";

    noBtn.style.top =
        Math.random() * (window.innerHeight - 50) + "px";
});

function showThanks() {

    document.body.innerHTML = `
        <div class="thank-page">

            <h1>🎉 THANK YOU! 🎉</h1>

            <h2>We’re Happy You Love 6TEEN Cafe ❤️</h2>

            <img src="6teencafe.jpeg">

            <p>☕ Thanks for your support!</p>

            <p>😊 We look forward to serving you again</p>

            <h3>📍 Barka, Oman 🇴🇲</h3>

        </div>
    `;
}

</script>

</body>
</html>
